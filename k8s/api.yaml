apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: queue-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: queue-demo-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: QUEUE_NAME, value: jobs}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: queue-demo
  labels: {app: api}
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30080}
